name: flutter_webxdc
description: "A new Flutter project."
version: 0.0.1
homepage:
# Not yet published: depends on flutter_webxdc_platform_interface via a
# local path dependency while the federated package split is developed in
# this single repo (see doc/design.md §2).
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # Parses manifest.toml inside .xdc archives (see doc/design.md §2.2).
  toml: ^0.18.0
  # Reads .xdc zip archives (see doc/design.md §3, WebxdcArchive).
  archive: ^4.0.7
  # Stable Dart contract for platform implementations (WebxdcUpdate,
  # WebxdcPlatform) — see doc/design.md §2.
  flutter_webxdc_platform_interface:
    path: flutter_webxdc_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
