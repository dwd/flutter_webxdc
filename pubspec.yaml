name: flutter_webxdc
description: "A new Flutter project."
version: 0.0.1
homepage:
# Not yet published: depends on flutter_webxdc_platform_interface via a
# local path dependency while the federated package split is developed in
# this single repo (see doc/design.md §2).
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # Parses manifest.toml inside .xdc archives (see doc/design.md §2.2).
  toml: ^0.18.0
  # Reads .xdc zip archives (see doc/design.md §3, WebxdcArchive).
  archive: ^4.0.7
  # Stable Dart contract for platform implementations (WebxdcUpdate,
  # WebxdcPlatform) — see doc/design.md §2.
  flutter_webxdc_platform_interface:
    path: flutter_webxdc_platform_interface
  # Default in-memory WebxdcPlatform implementation used under plain
  # `flutter test` and until a native/Web platform package registers
  # itself (see doc/design.md §2).
  flutter_webxdc_memory:
    path: flutter_webxdc_memory
  # Browser implementation registered automatically by Flutter's Web plugin
  # registrant. It hosts the app in a sandboxed iframe and is not imported by
  # the shared Dart API on native targets.
  flutter_webxdc_web:
    path: flutter_webxdc_web
  # Native platform implementation utilizing flutter_inappwebview
  flutter_webxdc_webview:
    path: flutter_webxdc_webview
  # Linux implementation: flutter_inappwebview does not support Linux, so
  # this hosts .xdc assets over a real loopback HTTP server and exposes an
  # "open in browser" host widget instead of an embedded WebView (see
  # doc/design.md §2/§6).
  flutter_webxdc_linux:
    path: flutter_webxdc_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      web:
        default_package: flutter_webxdc_web
      android:
        default_package: flutter_webxdc_webview
      ios:
        default_package: flutter_webxdc_webview
      macos:
        default_package: flutter_webxdc_webview
      windows:
        default_package: flutter_webxdc_webview
      linux:
        default_package: flutter_webxdc_linux

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
