name: flutter_webxdc_webview
description: "InAppWebView implementation of the flutter_webxdc plugin."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.2.0
  flutter: ">=3.16.0"

flutter:
  plugin:
    implements: flutter_webxdc
    platforms:
      android:
        dartPluginClass: WebviewWebxdcPlugin
      ios:
        dartPluginClass: WebviewWebxdcPlugin
      macos:
        dartPluginClass: WebviewWebxdcPlugin
      windows:
        dartPluginClass: WebviewWebxdcPlugin

dependencies:
  flutter:
    sdk: flutter
  file_selector: 1.0.3
  # Uses flutter_inappwebview_forge (a drop-in-API-compatible fork of
  # flutter_inappwebview) rather than the original flutter_inappwebview
  # package, because flutter_webxdc_linux also depends on
  # flutter_inappwebview_forge for its Linux/WPE WebKit backend. Mixing the
  # original package with the forge fork in the same app makes Flutter
  # register two different Windows plugins that both declare the native
  # CMake target `flutter_inappwebview_windows_plugin`, which fails to
  # configure with "add_library cannot create target ... because another
  # target with the same name already exists." Standardizing on the forge
  # fork for every platform (including Windows here) avoids that clash.
  flutter_inappwebview_forge: ^2.1.77
  flutter_webxdc_platform_interface:
    path: ../flutter_webxdc_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
