name: flutter_webxdc_linux
description: >-
  Linux implementation of the flutter_webxdc plugin. Hosts extracted `.xdc`
  assets over a real loopback HTTP server (shared WebxdcLocalServer) with
  the same Content-Security-Policy network-isolation contract as the other
  native platforms, and renders each app in a real, embedded, JS-bridged
  WebView using flutter_inappwebview_forge (a drop-in-API-compatible fork
  of flutter_inappwebview whose flutter_inappwebview_forge_linux backend
  is built on WPE WebKit). Building/running on Linux requires the system
  WPE WebKit runtime and dev packages to be installed; see doc/design.md
  in the flutter_webxdc repository for the full rationale, the exact
  pkg-config module names, and known limitations.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.2.0
  flutter: ">=3.16.0"

flutter:
  plugin:
    implements: flutter_webxdc
    platforms:
      linux:
        dartPluginClass: LinuxWebxdcPlugin

dependencies:
  flutter:
    sdk: flutter
  file_selector: 1.0.3
  flutter_inappwebview_forge: ^2.1.77
  flutter_webxdc_platform_interface:
    path: ../flutter_webxdc_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_inappwebview_forge_platform_interface: ^1.1.22

# Vendored local fork of flutter_inappwebview_forge_linux (1.0.8) with fixes
# for stale post-fork naming and WPE WebKit API breakage; see
# ../flutter_inappwebview_forge_linux and doc/design.md for details. Remove
# this override once those fixes land upstream on pub.dev.
dependency_overrides:
  flutter_inappwebview_forge_linux:
    path: ../flutter_inappwebview_forge_linux
