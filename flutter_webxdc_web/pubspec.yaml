name: flutter_webxdc_web
description: >-
  Flutter Web implementation of flutter_webxdc's WebxdcPlatform contract.
  Hosts .xdc apps in sandboxed iframe documents and bridges window.webxdc
  through a nonce-bound postMessage protocol.
version: 0.0.1
homepage:
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_webxdc_platform_interface:
    path: ../flutter_webxdc_platform_interface
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: flutter_webxdc
    platforms:
      web:
        pluginClass: FlutterWebxdcWebPlugin
        fileName: flutter_webxdc_web.dart
